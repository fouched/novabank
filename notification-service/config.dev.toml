[app]
name = "notification-service"
env = "development"
port = 8082

[postgres]
host = "localhost"
port = 5432
user = "changeme"
password = "changeme"
dbname = "novabank_notification_db"
sslmode = "disable"
max_conns = 10
min_conns = 1
max_conn_lifetime = "1h"
max_conn_idle_time = "30m"

[kafka]
brokers = ["localhost:9092"]
group_id = "notification-group"

[templates]
directory = "./templates"
cache_enabled = false  # Toggle to true in production configs!

[smtp]
host = "smtp.gmail.com"
port = 587
username = "changeme"
password = "changeme"
encryption = "STARTTLS"
from_email = "no-reply@novabank.localhost"

[logging]
level = "debug"
